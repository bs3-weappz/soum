
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحتي الأولى</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 15px;
            font-size: 28px;
        }

        p {
            color: #666;
            line-height: 1.8;
            margin-bottom: 25px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 16px;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            font-family: inherit;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        #message {
            margin-top: 20px;
            font-size: 18px;
            color: #764ba2;
            font-weight: bold;
            min-height: 25px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>👋 أهلاً بك!</h1>
        <p>هذه صفحة HTML بسيطة مع تنسيق جميل وتفاعل بسيط باستخدام JavaScript.</p>
        <button onclick="showMessage()">اضغط هنا</button>
        <div id="message"></div>
    </div>

    <script>
        function showMessage() {
            const messages = [
                "مرحباً بك في عالم البرمجة! 🚀",
                "أنت رائع! ⭐",
                "استمر في التعلم! 💪",
                "البرمجة ممتعة! 🎉"
            ];
            const random = Math.floor(Math.random() * messages.length);
            document.getElementById('message').textContent = messages[random];
        }
    </script>
</body>
</html>
