<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التجارب التفاعلية</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        --bg: #0f172a;
        --card: #1e293b;
        --text: #e2e8f0;
        --accent: #38bdf8;
        --accent2: #a78bfa;
        --success: #4ade80;
        --danger: #f87171;
    }

    body.light {
        --bg: #f1f5f9;
        --card: #ffffff;
        --text: #1e293b;
        --accent: #0284c7;
        --accent2: #7c3aed;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        padding: 20px;
        transition: background 0.4s, color 0.4s;
    }

    header {
        max-width: 1100px;
        margin: 0 auto 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 15px;
    }

    h1 {
        font-size: 26px;
        background: linear-gradient(90deg, var(--accent), var(--accent2));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    .theme-btn {
        background: var(--card);
        border: 2px solid var(--accent);
        color: var(--text);
        padding: 10px 20px;
        border-radius: 50px;
        cursor: pointer;
        font-family: inherit;
        font-size: 14px;
        transition: transform 0.2s;
    }
    .theme-btn:hover { transform: scale(1.05); }

    .grid {
        max-width: 1100px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 20px;
    }

    .card {
        background: var(--card);
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        transition: transform 0.3s, box-shadow 0.3s;
    }

    .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 40px rgba(56,189,248,0.15);
    }

    .card h2 {
        font-size: 18px;
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--accent);
    }

    /* عداد */
    .counter-display {
        font-size: 56px;
        font-weight: bold;
        text-align: center;
        margin: 10px 0 20px;
        color: var(--accent2);
        transition: transform 0.2s;
    }
    .counter-display.pulse { transform: scale(1.2); }

    .btn-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

    button.action {
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        color: white;
        border: none;
        padding: 10px 18px;
        border-radius: 10px;
        font-size: 15px;
        cursor: pointer;
        font-family: inherit;
        transition: transform 0.2s, opacity 0.2s;
        font-weight: bold;
    }
    button.action:hover { transform: translateY(-2px); opacity: 0.9; }
    button.action:active { transform: translateY(0); }

    /* قائمة المهام */
    .todo-input-row { display: flex; gap: 8px; margin-bottom: 14px; }
    .todo-input-row input {
        flex: 1;
        padding: 10px 14px;
        border-radius: 10px;
        border: 2px solid transparent;
        background: var(--bg);
        color: var(--text);
        font-family: inherit;
        font-size: 14px;
        outline: none;
        transition: border 0.2s;
    }
    .todo-input-row input:focus { border-color: var(--accent); }

    #todoList { list-style: none; max-height: 180px; overflow-y: auto; }
    #todoList li {
        background: var(--bg);
        padding: 10px 14px;
        border-radius: 10px;
        margin-bottom: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        animation: slideIn 0.3s ease;
    }
    #todoList li.done span { text-decoration: line-through; opacity: 0.5; }
    #todoList li span { cursor: pointer; flex: 1; }
    .del-btn {
        background: var(--danger);
        border: none;
        color: white;
        width: 26px; height: 26px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 14px;
        line-height: 1;
    }

    @keyframes slideIn {
        from { opacity: 0; transform: translateX(-20px); }
        to { opacity: 1; transform: translateX(0); }
    }

    /* الآلة الحاسبة */
    .calc-display {
        background: var(--bg);
        padding: 16px;
        border-radius: 10px;
        font-size: 24px;
        text-align: left;
        direction: ltr;
        margin-bottom: 12px;
        min-height: 58px;
        word-break: break-all;
        color: var(--accent);
        font-weight: bold;
    }
    .calc-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
    }
    .calc-grid button {
        padding: 14px 0;
        border: none;
        border-radius: 10px;
        background: var(--bg);
        color: var(--text);
        font-size: 16px;
        cursor: pointer;
        font-family: inherit;
        transition: background 0.2s, transform 0.1s;
    }
    .calc-grid button:hover { background: var(--accent); color: white; }
    .calc-grid button:active { transform: scale(0.95); }
    .calc-grid .op { background: var(--accent2); color: white; }
    .calc-grid .eq { background: var(--success); color: white; grid-column: span 2; }
    .calc-grid .clr { background: var(--danger); color: white; }

    /* تغيير اللون */
    .color-box {
        width: 100%;
        height: 80px;
        border-radius: 12px;
        margin-bottom: 12px;
        background: linear-gradient(135deg, #38bdf8, #a78bfa);
        transition: background 0.4s;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: bold;
        font-size: 14px;
        text-shadow: 0 2px 4px rgba(0,0,0,0.4);
    }
    input[type="color"] {
        width: 100%;
        height: 44px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        background: transparent;
    }

    /* عداد النقرات */
    .click-area {
        background: var(--bg);
        height: 100px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        cursor: pointer;
        user-select: none;
        transition: transform 0.15s;
        border: 2px dashed var(--accent);
    }
    .click-area:active { transform: scale(0.96); }

    footer {
        text-align: center;
        margin-top: 40px;
        opacity: 0.6;
        font-size: 13px;
    }
</style>
</head>
<body>

<header>
    <h1>🎨 لوحة التجارب التفاعلية</h1>
    <button class="theme-btn" onclick="toggleTheme()">🌙 تبديل الوضع</button>
</header>

<div class="grid">

    <!-- عداد -->
    <div class="card">
        <h2>🔢 العدّاد</h2>
        <div class="counter-display" id="counter">0</div>
        <div class="btn-row">
            <button class="action" onclick="changeCounter(-1)">−</button>
            <button class="action" onclick="resetCounter()">تصفير</button>
            <button class="action" onclick="changeCounter(1)">+</button>
        </div>
    </div>

    <!-- قائمة مهام -->
    <div class="card">
        <h2>✅ قائمة المهام</h2>
        <div class="todo-input-row">
            <input type="text" id="todoInput" placeholder="اكتب مهمة..." onkeypress="if(event.key==='Enter')addTodo()">
            <button class="action" onclick="addTodo()">أضف</button>
        </div>
        <ul id="todoList"></ul>
    </div>

    <!-- آلة حاسبة -->
    <div class="card">
        <h2>🧮 الآلة الحاسبة</h2>
        <div class="calc-display" id="calcDisplay">0</div>
        <div class="calc-grid">
            <button class="clr" onclick="calcClear()">C</button>
            <button onclick="calcInput('(')">(</button>
            <button onclick="calcInput(')')">)</button>
            <button class="op" onclick="calcInput('/')">÷</button>

            <button onclick="calcInput('7')">7</button>
            <button onclick="calcInput('8')">8</button>
            <button onclick="calcInput('9')">9</button>
            <button class="op" onclick="calcInput('*')">×</button>

            <button onclick="calcInput('4')">4</button>
            <button onclick="calcInput('5')">5</button>
            <button onclick="calcInput('6')">6</button>
            <button class="op" onclick="calcInput('-')">−</button>

            <button onclick="calcInput('1')">1</button>
            <button onclick="calcInput('2')">2</button>
            <button onclick="calcInput('3')">3</button>
            <button class="op" onclick="calcInput('+')">+</button>

            <button onclick="calcInput('0')">0</button>
            <button onclick="calcInput('.')">.</button>
            <button class="eq" onclick="calcResult()">=</button>
        </div>
    </div>

    <!-- تغيير اللون -->
    <div class="card">
        <h2>🎨 اختر لونك</h2>
        <div class="color-box" id="colorBox">معاينة اللون</div>
        <input type="color" value="#38bdf8" oninput="changeColor(this.value)">
    </div>

    <!-- عداد النقرات -->
    <div class="card">
        <h2>👆 سرعة النقر</h2>
        <div class="click-area" id="clickArea" onclick="registerClick()">0</div>
        <p style="font-size:13px; opacity:0.7; margin-top:10px; text-align:center;">
            اضغط بأسرع ما يمكن لمدة ثانيتين!
        </p>
    </div>

    <!-- رسالة عشوائية -->
    <div class="card">
        <h2>💬 اقتباس عشوائي</h2>
        <p id="quoteText" style="font-size:16px; line-height:1.8; min-height:80px; margin-bottom:16px;">
            اضغط الزر لعرض اقتباس محفّز ✨
        </p>
        <button class="action" onclick="showQuote()" style="width:100%;">اقتباس جديد</button>
    </div>

</div>

<footer>صُنع بـ ❤️ لتجربة HTML و CSS و JavaScript</footer>

<script>
    // ===== الوضع الليلي/النهاري =====
    function toggleTheme() {
        document.body.classList.toggle('light');
    }

    // ===== العدّاد =====
    let counter = 0;
    function changeCounter(amount) {
        counter += amount;
        const el = document.getElementById('counter');
        el.textContent = counter;
        el.classList.add('pulse');
        setTimeout(() => el.classList.remove('pulse'), 200);
    }
    function resetCounter() {
        counter = 0;
        document.getElementById('counter').textContent = 0;
    }

    // ===== قائمة المهام =====
    function addTodo() {
        const input = document.getElementById('todoInput');
        const text = input.value.trim();
        if (!text) return;

        const li = document.createElement('li');
        const span = document.createElement('span');
        span.textContent = text;
        span.onclick = () => li.classList.toggle('done');

        const del = document.createElement('button');
        del.className = 'del-btn';
        del.textContent = '×';
        del.onclick = () => li.remove();

        li.appendChild(span);
        li.appendChild(del);
        document.getElementById('todoList').appendChild(li);
        input.value = '';
        input.focus();
    }

    // ===== الآلة الحاسبة =====
    let calcExpr = '';
    function calcInput(val) {
        calcExpr += val;
        document.getElementById('calcDisplay').textContent = calcExpr;
    }
    function calcClear() {
        calcExpr = '';
        document.getElementById('calcDisplay').textContent = '0';
    }
    function calcResult() {
        try {
            // نقييم الآمن باستخدام Function
            const result = Function('"use strict"; return (' + calcExpr + ')')();
            document.getElementById('calcDisplay').textContent = result;
            calcExpr = String(result);
        } catch (e) {
            document.getElementById('calcDisplay').textContent = 'خطأ';
            calcExpr = '';
        }
    }

    // ===== تغيير اللون =====
    function changeColor(color) {
        const box = document.getElementById('colorBox');
        box.style.background = color;
        box.textContent = color;
    }

    // ===== عداد النقرات =====
    let clickCount = 0;
    let timerRunning = false;
    function registerClick() {
        clickCount++;
        document.getElementById('clickArea').textContent = clickCount;

        if (!timerRunning) {
            timerRunning = true;
            setTimeout(() => {
                alert('نقراتك في ثانيتين: ' + clickCount + ' 👏');
                clickCount = 0;
                document.getElementById('clickArea').textContent = 0;
                timerRunning = false;
            }, 2000);
        }
    }

    // ===== الاقتباسات =====
    const quotes = [
        "«النجاح هو مجموع جهود صغيرة تتكرر يومياً» — روبرت كولير",
        "«لا تنتظر الفرصة، اصنعها بنفسك» 💪",
        "«الكود الجميل يشبه الشعر، يُكتب مرة ويُقرأ آلاف المرات» 📝",
        "«كل خبير كان يوماً مبتدئاً» 🌱",
        "«افعل شيئاً اليوم يفتخر به أنت الغد» ✨",
        "«البرمجة ليست عن المعرفة، بل عن الفضول والصبر» 🚀",
        "«الطريق إلى النجاح مليء بالمحاولات الفاشلة التي علّمتك» 🎯"
    ];
    function showQuote() {
        const random = quotes[Math.floor(Math.random() * quotes.length)];
        document.getElementById('quoteText').textContent = random;
    }
</script>
</body>
</html>
